<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The mark sits on a navy tile: its own white cross and quadrant gaps
         otherwise merge into one white blob once a tab shrinks it to 16px.
         The .ico carries purpose-built 16/32/48 so the tab strip isn't
         downscaling a 192 on the fly. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#101c33" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Human Health Explorers | Free student-run health science camps in Naperville</title>
    <meta
      name="description"
      content="Human Health Explorers is a free, 100% student-run health science program for Naperville-area elementary and middle schoolers. 100+ students, 30+ schools, taught entirely by local high schoolers."
    />
    <meta property="og:title" content="Human Health Explorers" />
    <meta
      property="og:description"
      content="Curious minds. Healthier lives. Free health science camps and workshops for Naperville students, built and taught by local high schoolers."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
